name: Build Auralis Native Android

on:
  workflow_dispatch:
  push:
    branches: [ "native/kotlin-compose-foundation" ]
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Assemble native debug APK
        run: gradle -p native-android :app:assembleDebug --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
