name: Build Auralis Native Android

on:
  workflow_dispatch:
  push:
    branches: [ "native/kotlin-compose-foundation", "fix/android-sdk-ci", "fix/android-sdkmanager-path", "feature/ultimate-visualizer-engine" ]
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the SDK command-line tools already installed on the hosted runner.
      # Resolve sdkmanager explicitly because it is not guaranteed to be on PATH.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Assemble native debug APK
        run: gradle -p native-android :app:assembleDebug --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
